[package]
name = "sanskar-pdf-editor"
version = "0.0.1"
description = "Sanskar PDF Editor - Enterprise Edition"
authors = ["Sanskar Yadav"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.42.0"
base64 = "0.22.1"

[profile.release]
strip = true
lto = false
codegen-units = 16
panic = "abort"
